<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja prosta strona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Witaj w moim CI/CD demo!</h1>
    <p>Ta strona jest hostowana przez GitHub Pages.</p>

    <div class="calc">
      <input id="a" type="number" value="2">
      <span>+</span>
      <input id="b" type="number" value="3">
      <button id="calcBtn">Policz</button>
      <p id="result"></p>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.getElementById('calcBtn').addEventListener('click', () => {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      document.getElementById('result').textContent = 'Wynik: ' + add(a, b);
    });
  </script>
</body>
</html>
